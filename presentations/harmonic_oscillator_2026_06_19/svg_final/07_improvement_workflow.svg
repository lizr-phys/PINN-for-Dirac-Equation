<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFBFC" />

  <g id="header">
    <text x="60" y="72" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">07 / 改进流程</text>
    <text x="60" y="124" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2933">改进不是一次重写，而是增量加入物理约束</text>
    <line x1="60" y1="146" x2="1220" y2="146" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <g id="improvement-ladder">
    <line x1="134" y1="338" x2="1136" y2="338" stroke="#1C4E80" stroke-width="3" />
    <polygon points="1136,338 1122,330 1122,346" fill="#1C4E80" />

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M78,214 H234 A6,6 0 0 1 240,220 V398 A6,6 0 0 1 234,404 H78 A6,6 0 0 1 72,398 V220 A6,6 0 0 1 78,214 Z" />
    <circle cx="104" cy="246" r="16" fill="#1C4E80" />
    <text x="104" y="252" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
    <text x="128" y="250" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2933">单个基态</text>
    <text x="104" y="296" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">先验证网络能</text>
    <text x="104" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">学到最低能态</text>
    <text x="104" y="368" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#1C4E80">state n=0</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M268,214 H424 A6,6 0 0 1 430,220 V398 A6,6 0 0 1 424,404 H268 A6,6 0 0 1 262,398 V220 A6,6 0 0 1 268,214 Z" />
    <circle cx="294" cy="246" r="16" fill="#1C4E80" />
    <text x="294" y="252" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
    <text x="318" y="250" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2933">状态编号</text>
    <text x="294" y="296" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">把训练任务扩展为</text>
    <text x="294" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">n = 0, 1, 2</text>
    <text x="294" y="368" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#1C4E80">state_index</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M458,214 H614 A6,6 0 0 1 620,220 V398 A6,6 0 0 1 614,404 H458 A6,6 0 0 1 452,398 V220 A6,6 0 0 1 458,214 Z" />
    <circle cx="484" cy="246" r="16" fill="#1C4E80" />
    <text x="484" y="252" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="508" y="250" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2933">奇偶结构</text>
    <text x="484" y="296" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">先把波函数限制在</text>
    <text x="484" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">正确对称类中</text>
    <text x="484" y="368" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#1C4E80">parity</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M648,214 H804 A6,6 0 0 1 810,220 V398 A6,6 0 0 1 804,404 H648 A6,6 0 0 1 642,398 V220 A6,6 0 0 1 648,214 Z" />
    <circle cx="674" cy="246" r="16" fill="#D88C2D" />
    <text x="674" y="252" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
    <text x="698" y="250" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2933">归一化</text>
    <text x="674" y="296" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">防止尺度塌缩</text>
    <text x="674" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">或幅值漂移</text>
    <text x="674" y="368" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#D88C2D">norm_loss</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M838,214 H994 A6,6 0 0 1 1000,220 V398 A6,6 0 0 1 994,404 H838 A6,6 0 0 1 832,398 V220 A6,6 0 0 1 838,214 Z" />
    <circle cx="864" cy="246" r="16" fill="#D88C2D" />
    <text x="864" y="252" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
    <text x="888" y="250" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2933">正交约束</text>
    <text x="864" y="296" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">避免高能态重复</text>
    <text x="864" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">收敛到低能态</text>
    <text x="864" y="368" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#D88C2D">orth_loss</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M1028,214 H1202 A6,6 0 0 1 1208,220 V398 A6,6 0 0 1 1202,404 H1028 A6,6 0 0 1 1022,398 V220 A6,6 0 0 1 1028,214 Z" />
    <circle cx="1054" cy="246" r="16" fill="#4FA3A5" />
    <text x="1054" y="252" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">6</text>
    <text x="1078" y="250" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2933">锚点与导出</text>
    <text x="1054" y="296" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">加入少量数据点</text>
    <text x="1054" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#52606D">统一保存结果</text>
    <text x="1054" y="368" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#4FA3A5">plots, csv</text>
  </g>

  <g id="workflow-summary">
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M124,472 H1156 A6,6 0 0 1 1162,478 V560 A6,6 0 0 1 1156,566 H124 A6,6 0 0 1 118,560 V478 A6,6 0 0 1 124,472 Z" />
    
  <g transform="translate(154.0, 502.0) scale(1.3333333333333333)" fill="none" stroke="#1C4E80" stroke-width="2">
    <path d="M11.482 20.924a1.666 1.666 0 0 1 -1.157 -1.241a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.312 .318 1.644 1.794 .995 2.697" />
    <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
    <path d="M20 21l2 -2l-2 -2" />
    <path d="M17 17l-2 2l2 2" />
  </g>
    <text x="210" y="510" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933">程序层面的变化</text>
    <text x="210" y="542" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" fill="#1F2933">每次改进都对应一个失败模式：边界不稳、尺度不定、态混叠、能量偏移或输出不可复核。</text>
  </g>

  <g id="footer">
    <text x="60" y="654" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">改进路径的重点是把物理知识前置到模型、损失和训练循环里。</text>
    <text x="1220" y="654" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">07</text>
  </g>
</svg>