<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFBFC" />

  <g id="header">
    <text x="60" y="72" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">06 / 损失函数</text>
    <text x="60" y="124" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2933">损失函数把“像物理解”具体化为可优化目标</text>
    <line x1="60" y1="146" x2="1220" y2="146" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <g id="formula-card">
    <path fill="#FFFFFF" stroke="#CBD5E1" d="M66,184 H814 A6,6 0 0 1 820,190 V306 A6,6 0 0 1 814,312 H66 A6,6 0 0 1 60,306 V190 A6,6 0 0 1 66,184 Z" />
    
  <g transform="translate(92.0, 216.0) scale(1.25)" fill="none" stroke="#D88C2D" stroke-width="2">
    <path d="M3 12h4l3 8l4 -16l3 8h4" />
  </g>
    <text x="138" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933">训练目标是多项物理约束的加权和</text>
    <image href="data:image/png;base64," x="96" y="265.89" width="660" height="26.21" />
  </g>

  <g id="principle-card">
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M866,184 H1214 A6,6 0 0 1 1220,190 V306 A6,6 0 0 1 1214,312 H866 A6,6 0 0 1 860,306 V190 A6,6 0 0 1 866,184 Z" />
    <text x="892" y="232" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C4E80">核心判断</text>
    <text x="892" y="266" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" fill="#1F2933">不是只拟合曲线，而是同时满足</text>
    <text x="892" y="294" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" fill="#1F2933">方程、归一化、正交和能量结构。</text>
  </g>

  <g id="loss-matrix">
    <path fill="#FFFFFF" stroke="#CBD5E1" d="M66,366 H270 A6,6 0 0 1 276,372 V502 A6,6 0 0 1 270,508 H66 A6,6 0 0 1 60,502 V372 A6,6 0 0 1 66,366 Z" />
    <text x="92" y="406" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1C4E80">PDE residual</text>
    <text x="92" y="438" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#1F2933">逼近薛定谔方程</text>
    <text x="92" y="466" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">让每个内部点都满足</text>
    <text x="92" y="490" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">微分算符的本征关系</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M306,366 H510 A6,6 0 0 1 516,372 V502 A6,6 0 0 1 510,508 H306 A6,6 0 0 1 300,502 V372 A6,6 0 0 1 306,366 Z" />
    <text x="332" y="406" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1C4E80">Norm loss</text>
    <text x="332" y="438" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#1F2933">固定波函数尺度</text>
    <text x="332" y="466" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">避免零函数成为</text>
    <text x="332" y="490" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">形式上的低损失解</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M546,366 H750 A6,6 0 0 1 756,372 V502 A6,6 0 0 1 750,508 H546 A6,6 0 0 1 540,502 V372 A6,6 0 0 1 546,366 Z" />
    <text x="572" y="406" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1C4E80">Orth loss</text>
    <text x="572" y="438" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#1F2933">分离不同本征态</text>
    <text x="572" y="466" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">训练高能级时远离</text>
    <text x="572" y="490" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">已经学到的低能级</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M786,366 H990 A6,6 0 0 1 996,372 V502 A6,6 0 0 1 990,508 H786 A6,6 0 0 1 780,502 V372 A6,6 0 0 1 786,366 Z" />
    <text x="812" y="406" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#D88C2D">Data loss</text>
    <text x="812" y="438" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#1F2933">用少量解析锚点纠偏</text>
    <text x="812" y="466" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">不替代物理方程</text>
    <text x="812" y="490" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">只提供方向感</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M1026,366 H1214 A6,6 0 0 1 1220,372 V502 A6,6 0 0 1 1214,508 H1026 A6,6 0 0 1 1020,502 V372 A6,6 0 0 1 1026,366 Z" />
    <text x="1052" y="406" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#4FA3A5">Rayleigh</text>
    <text x="1052" y="438" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#1F2933">校准能量估计</text>
    <text x="1052" y="466" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">把波函数形状与</text>
    <text x="1052" y="490" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">能量期望联系起来</text>
  </g>

  <g id="bottom-message">
    <line x1="170" y1="542" x2="1110" y2="542" stroke="#1C4E80" stroke-width="2" />
    <polygon points="1110,542 1098,535 1098,549" fill="#1C4E80" />
    <text x="176" y="588" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933">这些项共同完成一件事：</text>
    <text x="414" y="588" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2933">把“本征态”从一个抽象物理概念，转写为神经网络可以下降的目标函数。</text>
  </g>

  <g id="footer">
    <text x="60" y="654" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">物理约束越具体，优化过程越不容易滑向无意义的数值解。</text>
    <text x="1220" y="654" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">06</text>
  </g>
</svg>