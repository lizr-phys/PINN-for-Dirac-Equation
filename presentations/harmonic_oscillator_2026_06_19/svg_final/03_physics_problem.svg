<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFBFC" />

  <g id="header">
    <text x="60" y="72" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">03 / 物理问题</text>
    <text x="60" y="124" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2933">先把求解对象写清楚</text>
    <line x1="60" y1="146" x2="1220" y2="146" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <g id="equation-panel">
    <path fill="#FFFFFF" stroke="#CBD5E1" d="M66,190 H734 A6,6 0 0 1 740,196 V364 A6,6 0 0 1 734,370 H66 A6,6 0 0 1 60,364 V196 A6,6 0 0 1 66,190 Z" />
    
  <g transform="translate(92.0, 218.0) scale(1.4166666666666667)" fill="none" stroke="#1C4E80" stroke-width="2">
    <path d="M3 19a2 2 0 0 0 2 2c2 0 2 -4 3 -9s1 -9 3 -9a2 2 0 0 1 2 2" />
    <path d="M5 12h6" />
    <path d="M15 12l6 6" />
    <path d="M15 18l6 -6" />
  </g>
    <text x="142" y="242" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933">无量纲定态薛定谔本征方程</text>
    <image href="data:image/png;base64," x="118" y="282.21" width="560" height="95.57" />
  </g>

  <g id="domain-panel">
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M66,414 H734 A6,6 0 0 1 740,420 V550 A6,6 0 0 1 734,556 H66 A6,6 0 0 1 60,550 V420 A6,6 0 0 1 66,414 Z" />
    <text x="96" y="454" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2933">求解区间：x in [-L, L]，L = 5</text>
    <text x="96" y="498" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2933">目标能级：E0 = 0.5，E1 = 1.5，E2 = 2.5</text>
    <text x="96" y="535" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">选择谐振子，是因为它有解析解和明确宇称，适合验证程序。</text>
  </g>

  <g id="verification-cards">
    <path fill="#FFFFFF" stroke="#CBD5E1" d="M796,190 H1174 A6,6 0 0 1 1180,196 V286 A6,6 0 0 1 1174,292 H796 A6,6 0 0 1 790,286 V196 A6,6 0 0 1 796,190 Z" />
    <text x="824" y="228" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#1C4E80">1. 有解析能级</text>
    <text x="824" y="264" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1F2933">预测能量可以直接与 n + 1/2 对比。</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M796,320 H1174 A6,6 0 0 1 1180,326 V416 A6,6 0 0 1 1174,422 H796 A6,6 0 0 1 790,416 V326 A6,6 0 0 1 796,320 Z" />
    <text x="824" y="358" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#1C4E80">2. 有解析波函数</text>
    <text x="824" y="394" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1F2933">波形误差可以从 CSV 和曲线同时检查。</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M796,450 H1174 A6,6 0 0 1 1180,456 V550 A6,6 0 0 1 1174,556 H796 A6,6 0 0 1 790,550 V456 A6,6 0 0 1 796,450 Z" />
    <text x="824" y="488" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#1C4E80">3. 有确定宇称</text>
    <text x="824" y="524" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1F2933">偶态和奇态可以直接写入网络结构。</text>
  </g>

  <g id="footer">
    <text x="60" y="654" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">验证对象越清楚，PINN 的每个约束项越容易解释。</text>
    <text x="1220" y="654" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">03</text>
  </g>
</svg>