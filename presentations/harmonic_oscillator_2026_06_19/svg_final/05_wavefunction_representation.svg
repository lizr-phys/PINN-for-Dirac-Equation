<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFBFC" />

  <g id="header">
    <text x="60" y="72" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">05 / 波函数表示</text>
    <text x="60" y="124" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2933">波函数不是直接输出，而是被物理先验包裹</text>
    <line x1="60" y1="146" x2="1220" y2="146" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <g id="formula-block">
    <path fill="#FFFFFF" stroke="#CBD5E1" d="M66,188 H574 A6,6 0 0 1 580,194 V354 A6,6 0 0 1 574,360 H66 A6,6 0 0 1 60,354 V194 A6,6 0 0 1 66,188 Z" />
    <text x="92" y="230" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933">边界条件硬约束</text>
    <image href="data:image/png;base64," x="104.55" y="262" width="418.91" height="88" />
  </g>

  <g id="boundary-plot">
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M66,402 H574 A6,6 0 0 1 580,408 V550 A6,6 0 0 1 574,556 H66 A6,6 0 0 1 60,550 V408 A6,6 0 0 1 66,402 Z" />
    <line x1="112" y1="500" x2="528" y2="500" stroke="#CBD5E1" stroke-width="1" />
    <line x1="112" y1="430" x2="112" y2="500" stroke="#CBD5E1" stroke-width="1" />
    <path d="M112 500 C190 492, 246 446, 320 434 C402 446, 450 492, 528 500" fill="none" stroke="#1C4E80" stroke-width="3" />
    <circle cx="112" cy="500" r="5" fill="#D88C2D" />
    <circle cx="528" cy="500" r="5" fill="#D88C2D" />
    <text x="94" y="526" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">-L</text>
    <text x="514" y="526" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">L</text>
    <text x="190" y="540" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#1F2933">边界因子让两端自动归零</text>
  </g>

  <g id="parity-panel">
    <path fill="#FFFFFF" stroke="#CBD5E1" d="M646,188 H1214 A6,6 0 0 1 1220,194 V550 A6,6 0 0 1 1214,556 H646 A6,6 0 0 1 640,550 V194 A6,6 0 0 1 646,188 Z" />
    <text x="676" y="232" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">宇称嵌入：把搜索空间先缩小</text>

    <path fill="#EEF3F8" stroke="#CBD5E1" d="M692,280 H890 A6,6 0 0 1 896,286 V370 A6,6 0 0 1 890,376 H692 A6,6 0 0 1 686,370 V286 A6,6 0 0 1 692,280 Z" />
    <text x="718" y="316" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#1C4E80">偶态 n = 0, 2</text>
    <text x="718" y="350" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="15" fill="#1F2933">[N(x)+N(-x)] / 2</text>

    <path fill="#EEF3F8" stroke="#CBD5E1" d="M970,280 H1168 A6,6 0 0 1 1174,286 V370 A6,6 0 0 1 1168,376 H970 A6,6 0 0 1 964,370 V286 A6,6 0 0 1 970,280 Z" />
    <text x="996" y="316" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#D88C2D">奇态 n = 1</text>
    <text x="996" y="350" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="15" fill="#1F2933">x * even_part</text>

    <line x1="896" y1="328" x2="964" y2="328" stroke="#1C4E80" stroke-width="2" />
    <polygon points="964,328 952,321 952,335" fill="#1C4E80" />

    <line x1="686" y1="444" x2="1174" y2="444" stroke="#CBD5E1" stroke-width="1" />
    <text x="686" y="486" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2933">物理意义：谐振子势能是偶函数，所以本征函数有确定宇称。</text>
    <text x="686" y="526" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2933">程序意义：网络不必在所有函数里搜索，只在正确结构里拟合。</text>
  </g>

  <g id="footer">
    <text x="60" y="654" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">边界和宇称都不是后处理，而是写入模型输出。</text>
    <text x="1220" y="654" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">05</text>
  </g>
</svg>