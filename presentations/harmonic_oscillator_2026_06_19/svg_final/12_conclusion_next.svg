<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FAFBFC" />

  <g id="header">
    <text x="60" y="72" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#52606D">12 / 结论与下一步</text>
    <text x="60" y="128" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="44" font-weight="700" fill="#1F2933">当前结论与下一步</text>
    <line x1="60" y1="154" x2="1220" y2="154" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <g id="headline">
    <text x="80" y="234" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="52" font-weight="700" fill="#1C4E80">PINN 的价值在于</text>
    <text x="80" y="294" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="52" font-weight="700" fill="#D88C2D">把物理结构写进训练过程</text>
  </g>

  <g id="summary-cards">
    <path fill="#FFFFFF" stroke="#CBD5E1" d="M86,370 H414 A6,6 0 0 1 420,376 V514 A6,6 0 0 1 414,520 H86 A6,6 0 0 1 80,514 V376 A6,6 0 0 1 86,370 Z" />
    
  <g transform="translate(112.0, 406.0) scale(1.3333333333333333)" fill="none" stroke="#2F7D59" stroke-width="2">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>
    <text x="162" y="416" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">已经完成</text>
    <text x="112" y="464" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1F2933">程序能求解 n = 0, 1, 2</text>
    <text x="112" y="494" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1F2933">前三个一维谐振子本征态。</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M476,370 H804 A6,6 0 0 1 810,376 V514 A6,6 0 0 1 804,520 H476 A6,6 0 0 1 470,514 V376 A6,6 0 0 1 476,370 Z" />
    
  <g transform="translate(502.0, 406.0) scale(1.3333333333333333)" fill="none" stroke="#D88C2D" stroke-width="2">
    <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7" />
    <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3" />
    <path d="M9.7 17l4.6 0" />
  </g>
    <text x="552" y="416" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">主要理解</text>
    <text x="502" y="464" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1F2933">本征值问题的难点不只在拟合，</text>
    <text x="502" y="494" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1F2933">更在尺度、正交和边界约束。</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" d="M866,370 H1194 A6,6 0 0 1 1200,376 V514 A6,6 0 0 1 1194,520 H866 A6,6 0 0 1 860,514 V376 A6,6 0 0 1 866,370 Z" />
    
  <g transform="translate(892.0, 406.0) scale(1.3333333333333333)" fill="none" stroke="#4FA3A5" stroke-width="2">
    <path d="M3 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
    <path d="M19 7a2 2 0 1 0 0 -4a2 2 0 0 0 0 4" />
    <path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5" />
  </g>
    <text x="942" y="416" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">下一步</text>
    <text x="892" y="464" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1F2933">先增强鲁棒性和消融实验，</text>
    <text x="892" y="494" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" fill="#1F2933">再迁移到 Dirac 最小算例。</text>
  </g>

  <g id="closing-line">
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M86,566 H1194 A6,6 0 0 1 1200,572 V614 A6,6 0 0 1 1194,620 H86 A6,6 0 0 1 80,614 V572 A6,6 0 0 1 86,566 Z" />
    <text x="112" y="600" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#1F2933">这份工作最重要的产出，是把阅读得到的方法论转化成了可运行、可验证、可继续扩展的程序框架。</text>
  </g>

  <g id="footer">
    <text x="60" y="654" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">谢谢。</text>
    <text x="1220" y="654" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#7B8794">12</text>
  </g>
</svg>